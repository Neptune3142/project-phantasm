# =============================================================================
# Project Phantasm — docker-compose
# Spins up n8n (optional automation engine) and a backend container.
# The frontend dev server is intentionally NOT containerised — run it on the
# host with `npm run dev` for fast HMR.
# =============================================================================
version: "3.9"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: phantasm-n8n
    ports:
      - "5679:5679"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5679
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679/
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID:-}
      - GMAIL_RECIPIENT=${GMAIL_RECIPIENT:-}
      - N8N_BASIC_AUTH_ACTIVE=false
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data: {}
